function normalizeState(v){if(!v||typeof v!=='object'||Array.isArray(v))throw Error('Invalid record');return{version:3,progress:(v.progress&&typeof v.progress==='object'&&!Array.isArray(v.progress)?Object.fromEntries(Object.entries(v.progress).filter(([k,x])=>validKeys.has(k)&&[0,1,2].includes(x))):{}),notes:(v.notes&&typeof v.notes==='object'&&!Array.isArray(v.notes)?Object.fromEntries(Object.entries(v.notes).filter(([k,x])=>validKeys.has(k)&&typeof x==='string').map(([k,x])=>[k,x.slice(0,10000)])):{}),favorites:Array.isArray(v.favorites)?v.favorites.filter(k=>validKeys.has(k)):[],journal:Array.isArray(v.journal)?v.journal.filter(e=>e&&typeof e.text==='string'&&typeof e.title==='string').slice(0,300).map(e=>({id:String(e.id||Date.now()),title:e.title.slice(0,150),text:e.text.slice(0,10000),program:CATALOGUE.some(p=>p.id===e.program)?e.program:'',date:String(e.date||'')})):[],history:Array.isArray(v.history)?v.history.filter(e=>e&&typeof e.label==='string').slice(0,300).map(e=>({date:String(e.date||''),label:e.label.slice(0,300)})):[]}}
const index=[],validKeys=new Set();for(const p of CATALOGUE){p.courses.forEach((c,ci)=>{c.modules.forEach((m,mi)=>{m.concepts.forEach((name,ki)=>{const key=`${p.id}/${ci}/${mi}/${ki}`;validKeys.add(key);index.push({type:'concept',name,key,pid:p.id,ci,mi,ki,course:c.title,module:m.title,program:p.title,track:p.track})});index.push({type:'module',name:m.title,pid:p.id,ci,mi,course:c.title,program:p.title,track:p.track})});index.push({type:'course',name:c.title,pid:p.id,ci,program:p.title,track:p.track})});index.push({type:'specialization',name:p.title,pid:p.id,program:p.title,track:p.track})}
let S;try{const raw=localStorage.getItem(STORAGE_KEY);S=raw?normalizeState(JSON.parse(raw)):blankState()}catch(e){S=blankState()}
const UI={view:'library',pid:null,track:'all',filter:'all',sort:'original',openCourses:new Set(),openModules:new Set(),noteKey:null,searchOpen:false};
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S))}catch(e){toast('Browser storage unavailable. Export a backup to keep your record.')}}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('visible'),3000)}
function getP(pid){return CATALOGUE.find(x=>x.id===pid)}
function keysOf(pid,ci=null,mi=null){const p=getP(pid);if(!p)return[];const list=[];p.courses.forEach((c,i)=>{if(ci!==null&&ci!==i)return;c.modules.forEach((m,j)=>{if(mi!==null&&mi!==j)return;m.concepts.forEach((k,n)=>list.push(`${pid}/${i}/${j}/${n}`))})});return list}
function calc(keys){let mastered=0,learning=0;for(const key of keys){if(S.progress[key]===2)mastered++;if(S.progress[key]===1)learning++}return{mastered,learning,total:keys.length,percent:keys.length?Math.round(mastered/keys.length*100):0}}
const allKeys=index.filter(x=>x.type==='concept').map(x=>x.key);
const totals={programs:CATALOGUE.length,courses:CATALOGUE.reduce((a,p)=>a+p.courses.length,0),modules:CATALOGUE.reduce((a,p)=>a+p.courses.reduce((b,c)=>b+c.modules.length,0),0),concepts:allKeys.length};
function statusName(k){return ['Not started','Studying','Mastered'][S.progress[k]||0]}
function history(label){S.history.unshift({date:new Date().toISOString(),label});S.history=S.history.slice(0,250)}
function changeOne(key,newStatus){if(!validKeys.has(key))return;const old=S.progress[key]||0;if(old===newStatus)return;if(newStatus===0)delete S.progress[key];else S.progress[key]=newStatus;const data=index.find(x=>x.key===key);history(`${data.name}: ${['not started','studying','mastered'][newStatus]}`);save();renderPreserve();if(UI.noteKey===key)renderDrawer()}
function changeGroup(keys,newStatus,label){let changed=0;keys.forEach(k=>{if((S.progress[k]||0)!==newStatus){changed++;if(newStatus===0)delete S.progress[k];else S.progress[k]=newStatus}});if(changed){history(`${label}: ${newStatus===2?'mastered':newStatus===1?'studying':'cleared'} (${changed} concepts)`);save();renderPreserve();toast(`${changed} concepts updated`)}else toast('No changes needed')}
function iconPct(pct){return `<span style="color:var(--red)">${pct}%</span>`}
function renderNav(){const isHome=UI.view==='library';$('#mainNav').innerHTML=`<button class="nav-btn ${isHome?'active':''}" data-action="home"><span class="nav-symbol">◈</span>Specializations<span class="nav-mini">12</span></button><button class="nav-btn ${UI.view==='journal'?'active':''}" data-action="journal"><span class="nav-symbol">✎</span>Field journal</button><button class="nav-btn ${UI.view==='saved'?'active':''}" data-action="saved"><span class="nav-symbol">✧</span>Saved concepts<span class="nav-mini">${S.favorites.length}</span></button>`;
$('#programNav').innerHTML=CATALOGUE.map((p,i)=>`<button class="aside-prog" data-action="program" data-pid="${p.id}" title="${esc(p.title)}"><span class="aside-index">${String(i+1).padStart(2,'0')}</span><span class="aside-name">${esc(p.title)}</span><i class="aside-dot ${calc(keysOf(p.id)).mastered?'has':''}"></i></button>`).join('');const c=calc(allKeys);$('#asidePct').textContent=c.percent+'%';$('#asideBar').style.width=c.percent+'%'}

function hero(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Personal learning chronicle · 2026 onward</div><h1 class="display">Ink &<em>Discipline.</em></h1><p class="hero-desc">Twelve chosen specializations. One record of study, written concept by concept. No deadlines imposed. No progress assumed.</p><div class="hero-note"><span></span>The path is recorded by the traveler.</div></div><div class="hero-art">${samuraiArt}<div class="kanji-side">学びの道 · 一歩ずつ</div></div></section>`}
function footer(){return `<div class="footerline"><span>LEARNING ATLAS / INK & DISCIPLINE</span><span>Local-first study record · Course titles based on Coursera · Modules are curated study outlines</span></div>`}
function library(){const overall=calc(allKeys);const filtered=CATALOGUE.filter(p=>(UI.track==='all'||UI.track===p.track)&&((()=>{const a=calc(keysOf(p.id));return UI.filter==='all'||(UI.filter==='untouched'&&a.mastered===0&&a.learning===0)||(UI.filter==='active'&&(a.mastered+a.learning)>0&&a.mastered<a.total)||(UI.filter==='done'&&a.mastered===a.total)})()));if(UI.sort==='name')filtered.sort((a,b)=>a.title.localeCompare(b.title));if(UI.sort==='progress')filtered.sort((a,b)=>calc(keysOf(b.id)).percent-calc(keysOf(a.id)).percent);let cards=filtered.map(p=>{const n=CATALOGUE.indexOf(p)+1,a=calc(keysOf(p.id));return `<a href="#program/${p.id}" class="program-card"><div class="program-card-inner"><div class="pc-upper"><span class="pc-index">No. ${String(n).padStart(2,'0')}</span><span class="pc-track">${esc(TRACKS[p.track].short)} / ${TRACKS[p.track].marker}</span></div><h3>${esc(p.title)}</h3><div class="pc-school">${esc(p.school)}</div></div><div class="pc-footer"><div class="pc-bottom-left"><span>${p.courses.length} courses</span><div class="pc-mini"><i style="width:${a.percent}%"></i></div><span>${a.percent}%</span></div><span class="pc-arrow">↗</span></div></a>`}).join('');return `${hero()}<div class="summary"><div class="stat"><div class="stat-num">${totals.programs}<span class="stat-unit"> / chosen</span></div><div class="stat-label">Specializations</div></div><div class="stat"><div class="stat-num">${totals.courses}</div><div class="stat-label">Courses</div></div><div class="stat"><div class="stat-num">${totals.modules}</div><div class="stat-label">Study modules</div></div><div class="stat"><div class="stat-num">${overall.mastered}<span class="stat-unit"> / ${totals.concepts}</span></div><div class="stat-label">Concepts mastered</div></div></div><div class="section-intro"><div><div class="eyebrow">The twelve scrolls</div><h2 class="display">Study catalogue.</h2></div><div class="track-pills">${[['all','All tracks'],...Object.entries(TRACKS).map(([id,x])=>[id,x.short])].map(([id,label])=>`<button class="pill ${UI.track===id?'active':''}" data-action="track" data-track="${id}">${label}</button>`).join('')}</div></div><div class="filter-row"><div class="status-pills">${[['all','All'],['untouched','Untouched'],['active','In progress'],['done','Mastered']].map(([f,n])=>`<button class="quiet-pill ${UI.filter===f?'active':''}" data-action="filter" data-filter="${f}">${n}</button>`).join('')}</div><select class="order-select" id="sortSelect" aria-label="Sort specializations"><option value="original" ${UI.sort==='original'?'selected':''}>Curated order</option><option value="name" ${UI.sort==='name'?'selected':''}>Alphabetical</option><option value="progress" ${UI.sort==='progress'?'selected':''}>Most progress</option></select></div>${cards?`<div class="program-grid">${cards}</div>`:`<div class="empty"><h3>No scrolls match this filter.</h3><button class="outline-btn" data-action="clear-filters">Show all</button></div>`}${footer()}`}
function detail(pid){const p=getP(pid);if(!p)return library();const keys=keysOf(pid),a=calc(keys);return `<header class="detail-head"><button class="back" data-action="home">← Back to the twelve scrolls</button><div class="detail-flex"><div><div class="eyebrow">Scroll ${String(CATALOGUE.indexOf(p)+1).padStart(2,'0')} · ${esc(TRACKS[p.track].short)}</div><h1 class="display">${esc(p.title)}</h1><div class="detail-meta">${esc(p.school)} · ${p.courses.length} courses · ${keys.length} concepts</div></div><div class="detail-seal"><span class="seal-number">${a.percent}</span><span class="seal-caption">% mastered</span></div></div><div class="detail-actions"><button class="outline-btn" data-action="open-all" data-pid="${pid}">Unfold all courses</button><button class="outline-btn ghost" data-action="close-all">Fold all</button><a class="source-link" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">View on Coursera ↗</a></div><div class="detail-progress"><div class="bar"><i style="width:${a.percent}%"></i></div><span>${a.mastered} mastered · ${a.learning} studying</span></div></header><div class="section-rule"><b>The course scrolls</b><span class="subtle">${p.courses.length} chapters</span></div><div class="legend">Click a concept's seal to cycle: <strong>○ Not started → ◐ Studying → ✓ Mastered.</strong> Use the ✎ icon for personal notes and ☆ to save for review.</div><div class="courses">${p.courses.map((c,ci)=>renderCourse(p,c,ci)).join('')}</div>${footer()}`}
function renderCourse(p,c,ci){const courseKey=`${p.id}/${ci}`,open=UI.openCourses.has(courseKey),a=calc(keysOf(p.id,ci));return `<section class="course ${open?'open':''}" id="course-${p.id}-${ci}"><button class="course-head" data-action="course" data-pid="${p.id}" data-ci="${ci}" aria-expanded="${open}"><span class="course-idx">${String(ci+1).padStart(2,'0')}</span><span class="course-main"><span class="course-title">${esc(c.title)}</span><span class="course-hint" style="display:block">${c.modules.length} modules · ${a.mastered}/${a.total} concepts mastered</span></span><span class="course-progress">${a.percent}%</span><span class="course-chevron">›</span></button>${open?`<div class="course-body"><div class="course-toolbar"><span class="course-hint-msg">Mark what you have genuinely studied.</span><div class="toolbar-actions"><button class="text-action" data-action="group" data-pid="${p.id}" data-ci="${ci}" data-status="2">Master course</button><button class="text-action" data-action="group" data-pid="${p.id}" data-ci="${ci}" data-status="0">Clear course</button></div></div>${c.modules.map((m,mi)=>renderModule(p,c,ci,m,mi)).join('')}</div>`:''}</section>`}
function renderModule(p,c,ci,m,mi){const mk=`${p.id}/${ci}/${mi}`,open=UI.openModules.has(mk),a=calc(keysOf(p.id,ci,mi));return `<div class="module ${open?'open':''}" id="module-${p.id}-${ci}-${mi}"><button class="module-head" data-action="module" data-pid="${p.id}" data-ci="${ci}" data-mi="${mi}" aria-expanded="${open}"><span class="module-count">${String(mi+1).padStart(2,'0')}</span><span class="module-title">${esc(m.title)}</span><span class="module-progress">${a.mastered}/${a.total}</span><span class="module-caret">›</span></button>${open?`<div class="module-body"><div class="module-tools"><button class="text-action" data-action="group" data-pid="${p.id}" data-ci="${ci}" data-mi="${mi}" data-status="2">Master module</button><button class="text-action" data-action="group" data-pid="${p.id}" data-ci="${ci}" data-mi="${mi}" data-status="0">Clear</button></div><div class="concepts">${m.concepts.map((name,ki)=>{const key=`${p.id}/${ci}/${mi}/${ki}`,st=S.progress[key]||0;return `<div class="concept" data-status="${st}"><button class="state-btn" data-action="cycle" data-key="${key}" title="${statusName(key)}. Click to advance" aria-label="${esc(name)}: ${statusName(key)}">${['○','◐','✓'][st]}</button><span class="concept-name">${esc(name)}</span><button class="fave-btn ${S.favorites.includes(key)?'saved':''}" data-action="fave" data-key="${key}" aria-label="${S.favorites.includes(key)?'Remove saved':'Save'} ${esc(name)}">${S.favorites.includes(key)?'★':'☆'}</button><button class="note-btn ${S.notes[key]?'has-note':''}" data-action="note" data-key="${key}" title="Personal notes">✎</button></div>`}).join('')}</div></div>`:''}</div>`}
function noteDrawer(key){const data=index.find(x=>x.key===key);if(!data)return'';const st=S.progress[key]||0;return `<div class="drawer-head"><div class="eyebrow">Field annotations</div><button class="icon-btn" data-action="close-drawer" aria-label="Close notes">×</button></div><h2>${esc(data.name)}</h2><div class="path">${esc(data.program)}<br>${esc(data.course)}<br>${esc(data.module)}</div><hr><label class="field-label">Your understanding</label><div class="status-buttons">${['Not started','Studying','Mastered'].map((s,i)=>`<button class="${st===i?'active':''}" data-action="set-status" data-key="${key}" data-status="${i}">${['○','◐','✓'][i]} ${s}</button>`).join('')}</div><hr><label class="field-label" for="conceptNote">Personal notes · autosaved</label><textarea id="conceptNote" data-key="${key}" placeholder="Write what you learned, what remains unclear, or a useful explanation in your own words...">${esc(S.notes[key]||'')}</textarea><button class="outline-btn" data-action="fave" data-key="${key}">${S.favorites.includes(key)?'★ Remove from saved concepts':'☆ Save for review'}</button><p class="drawer-small">This note belongs only to your learning record. It is stored locally in your browser.</p>`}
function renderDrawer(){if(!UI.noteKey)return;$('#drawer').innerHTML=noteDrawer(UI.noteKey)}
function journal(){const dates=S.history.slice(0,24);return `<section class="journal-head"><div class="eyebrow">A private record of the journey</div><h1 class="display">Field <span class="red">journal.</span></h1><p class="subtle">Notes on your studies. Reflections, uncertainties, discoveries. Nothing is prescribed.</p></section><div class="journal-grid"><section><div class="section-rule"><b>Write a reflection</b></div><form id="journalForm" class="journal-form"><label for="journalTitle">Title</label><input id="journalTitle" required maxlength="150" placeholder="Something I understood today"><label for="journalProgram">Specialization</label><select id="journalProgram"><option value="">General study reflection</option>${CATALOGUE.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select><label for="journalText">Reflection</label><textarea id="journalText" required placeholder="What did you learn? What questions remain?"></textarea><button class="download-btn" type="submit">Record reflection ↗</button></form><div class="section-rule" style="margin-top:39px"><b>Study activity</b></div><div class="history-list">${dates.length?dates.map(e=>`<div class="history-item"><span class="history-date">${fmt(e.date)}</span><span class="history-content">${esc(e.label)}</span></div>`).join(''):'<p class="subtle">The page is blank. Your first study update will appear here.</p>'}</div></section><section><div class="section-rule"><b>Written reflections</b></div>${S.journal.length?S.journal.map(e=>`<article class="journal-entry"><div class="entry-date">${fmt(e.date)}</div><div class="entry-title">${esc(e.title)}</div><div class="entry-text">${esc(e.text)}</div><div class="entry-tag">${esc(getP(e.program)?.title||'General study reflection')}</div><button class="tiny-close" data-action="delete-entry" data-id="${esc(e.id)}">Delete entry</button></article>`).join(''):'<div class="empty"><h3>No reflections yet.</h3><p class="subtle">When you want to put a learning moment into words, this space is yours.</p></div>'}</section></div>${footer()}`}
function fmt(d){const x=new Date(d);return isNaN(x.getTime())?'—':x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'})}
function saved(){const items=S.favorites.map(k=>index.find(x=>x.key===k)).filter(Boolean);return `<section class="journal-head"><div class="eyebrow">Marked for return</div><h1 class="display">Saved <span class="red">concepts.</span></h1><p class="subtle">A personal collection from your twelve specializations, ready whenever you want to revisit them.</p></section><div class="section-rule"><b>${items.length} marked concepts</b></div>${items.length?`<div class="program-grid">${items.map(d=>`<div class="program-card" style="min-height:155px"><div class="program-card-inner"><div class="pc-upper"><span class="pc-index">${['○','◐','✓'][S.progress[d.key]||0]} ${statusName(d.key)}</span><button class="fave-btn saved" data-action="fave" data-key="${d.key}">★</button></div><h3 style="margin:15px 0 10px;font-size:21px">${esc(d.name)}</h3><div class="pc-school">${esc(d.course)}</div></div><div class="pc-footer"><button class="text-action" data-action="jump" data-key="${d.key}">Open in course ↗</button><button class="text-action" data-action="note" data-key="${d.key}">Add note ✎</button></div></div>`).join('')}</div>`:'<div class="empty"><h3>No saved concepts.</h3><p class="subtle">Use the star on any concept to collect it here.</p><button class="outline-btn" data-action="home">Explore the catalogue</button></div>'}${footer()}`}
function render(){renderNav();$('#app').innerHTML=UI.view==='program'?detail(UI.pid):UI.view==='journal'?journal():UI.view==='saved'?saved():library()}
function renderPreserve(){const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'})}
function route(){const hash=decodeURIComponent(location.hash.slice(1)),parts=hash.split('/');if(parts[0]==='program'&&getP(parts[1])){const changed=UI.pid!==parts[1];UI.view='program';UI.pid=parts[1];if(changed){UI.openCourses=new Set([`${parts[1]}/0`]);UI.openModules=new Set([`${parts[1]}/0/0`])}}else if(['journal','saved'].includes(parts[0])){UI.view=parts[0];UI.pid=null}else{UI.view='library';UI.pid=null}render();window.scrollTo(0,0);closeMobile()}
function openProgram(pid,ci=null,mi=null){if(!getP(pid))return;const reveal=()=>{UI.openCourses.add(`${pid}/${ci==null?0:ci}`);if(mi!==null)UI.openModules.add(`${pid}/${ci}/${mi}`);render();if(ci!==null){const id=mi===null?'course-'+pid+'-'+ci:'module-'+pid+'-'+ci+'-'+mi;document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'center'})}};if(location.hash!==`#program/${pid}`){location.hash=`program/${pid}`;setTimeout(reveal,100)}else reveal();closeSearch()}
function searchOpen(){UI.searchOpen=true;$('#searchOverlay').classList.remove('hidden');$('#searchInput').value='';renderResults('');requestAnimationFrame(()=>$('#searchInput').focus())}
function closeSearch(){UI.searchOpen=false;$('#searchOverlay').classList.add('hidden')}
function renderResults(q){const t=q.trim().toLowerCase();let matches=t?index.map(e=>({...e,score:(e.name.toLowerCase()===t?100:e.name.toLowerCase().startsWith(t)?60:e.name.toLowerCase().includes(t)?40:0)+(e.type==='specialization'?15:e.type==='course'?9:0)})).filter(e=>e.score||[e.program,e.course,e.module].some(x=>x&&x.toLowerCase().includes(t))).sort((a,b)=>b.score-a.score).slice(0,40):index.filter(e=>e.type==='specialization').slice(0,12);$('#searchResults').innerHTML=matches.length?matches.map(e=>`<button class="result" data-action="result" data-pid="${e.pid}" data-ci="${e.ci??''}" data-mi="${e.mi??''}"><span class="result-kind">${e.type}</span><span><span class="result-title">${esc(e.name)}</span><span class="result-parent" style="display:block">${esc(e.type==='specialization'?TRACKS[e.track].name:e.program+(e.course?' · '+e.course:''))}</span></span><span class="result-chev">↗</span></button>`).join(''):'<div class="empty">No matching concepts found.</div>'}
function openDrawer(key){if(!validKeys.has(key))return;UI.noteKey=key;renderDrawer();$('#drawer').classList.remove('hidden');$('#drawerVeil').classList.remove('hidden')}
function closeDrawer(){UI.noteKey=null;$('#drawer').classList.add('hidden');$('#drawerVeil').classList.add('hidden')}
function menuClose(){$('#menu').classList.add('hidden');$('#menuBackdrop').classList.add('hidden')}
function menuToggle(){$('#menu').classList.toggle('hidden');$('#menuBackdrop').classList.toggle('hidden')}
function closeMobile(){$('#sidebar').classList.remove('mobile-open');$('#mobileScrim').classList.remove('on')}
function download(){const blob=new Blob([JSON.stringify({app:'Learning Atlas · Ink & Discipline',exportedAt:new Date().toISOString(),...S},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='learning-atlas-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200);toast('Your study record has been exported');menuClose()}
function action(el){const a=el.dataset.action,pid=el.dataset.pid,ci=el.dataset.ci==null?null:Number(el.dataset.ci),mi=el.dataset.mi==null?null:Number(el.dataset.mi),key=el.dataset.key;if(a==='mobile'){$('#sidebar').classList.toggle('mobile-open');$('#mobileScrim').classList.toggle('on')}if(a==='home'){if(location.hash==='#library')route();else location.hash='library'}if(a==='program'){if(location.hash==='#program/'+pid)route();else location.hash='program/'+pid}if(a==='journal')location.hash='journal';if(a==='saved')location.hash='saved';if(a==='track'){UI.track=el.dataset.track;renderPreserve()}if(a==='filter'){UI.filter=el.dataset.filter;renderPreserve()}if(a==='clear-filters'){UI.filter='all';UI.track='all';renderPreserve()}if(a==='course'){const k=pid+'/'+ci;UI.openCourses.has(k)?UI.openCourses.delete(k):UI.openCourses.add(k);renderPreserve()}if(a==='module'){const k=pid+'/'+ci+'/'+mi;UI.openModules.has(k)?UI.openModules.delete(k):UI.openModules.add(k);renderPreserve()}if(a==='open-all'){getP(pid).courses.forEach((c,i)=>{UI.openCourses.add(pid+'/'+i);c.modules.forEach((_,j)=>UI.openModules.add(pid+'/'+i+'/'+j))});renderPreserve()}if(a==='close-all'){UI.openCourses.clear();UI.openModules.clear();renderPreserve()}if(a==='cycle')changeOne(key,((S.progress[key]||0)+1)%3);if(a==='set-status')changeOne(key,Number(el.dataset.status));if(a==='group')changeGroup(keysOf(pid,ci,mi),Number(el.dataset.status),mi!==null?'Module':ci!==null?'Course':'Specialization');if(a==='note')openDrawer(key);if(a==='close-drawer')closeDrawer();if(a==='fave'){S.favorites=S.favorites.includes(key)?S.favorites.filter(k=>k!==key):[...S.favorites,key];save();renderPreserve();if(UI.noteKey)renderDrawer();toast(S.favorites.includes(key)?'Concept saved for review':'Concept removed from saved')}if(a==='search')searchOpen();if(a==='close-search')closeSearch();if(a==='result'){openProgram(pid,el.dataset.ci===''?null:Number(el.dataset.ci),el.dataset.mi===''?null:Number(el.dataset.mi))}if(a==='jump'){const [p,c,m]=key.split('/');openProgram(p,Number(c),Number(m))}if(a==='menu')menuToggle();if(a==='close-menu')menuClose();if(a==='export')download();if(a==='import'){$('#fileInput').click();menuClose()}if(a==='reset'){menuClose();if(confirm('Reset every concept, personal note, bookmark, reflection and activity record? This cannot be undone. Export a backup first if you want to keep them.')){S=blankState();save();render();closeDrawer();toast('The learning record is now blank')}}if(a==='delete-entry'){if(confirm('Delete this journal entry?')){S.journal=S.journal.filter(x=>x.id!==el.dataset.id);save();renderPreserve()}}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn){e.preventDefault();action(btn)}});window.addEventListener('hashchange',route);$('#mobileScrim').addEventListener('click',closeMobile);$('#searchOverlay').addEventListener('click',e=>{if(e.target===$('#searchOverlay'))closeSearch()});$('#searchInput').addEventListener('input',e=>renderResults(e.target.value));$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#searchResults .result')?.click();e.preventDefault()}});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchOpen()}else if(e.key==='Escape'){closeSearch();closeDrawer();menuClose();closeMobile()}else if(e.key==='/'&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA'){e.preventDefault();searchOpen()}});
document.addEventListener('input',e=>{if(e.target.id==='conceptNote'){S.notes[e.target.dataset.key]=e.target.value.slice(0,10000);save()}});document.addEventListener('change',e=>{if(e.target.id==='sortSelect'){UI.sort=e.target.value;renderPreserve()}});document.addEventListener('submit',e=>{if(e.target.id==='journalForm'){e.preventDefault();const title=$('#journalTitle').value.trim(),text=$('#journalText').value.trim(),program=$('#journalProgram').value;if(!title||!text)return;S.journal.unshift({id:String(Date.now())+Math.random().toString(36).slice(2),date:new Date().toISOString(),title:title.slice(0,150),text:text.slice(0,10000),program});history(`Reflection recorded: ${title}`);save();renderPreserve();toast('Reflection added to your journal')}});
$('#fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text());const next=normalizeState(raw);if(confirm('Restore this backup and replace the current study record?')){S=next;save();closeDrawer();route();toast('Study record restored')}}catch(err){toast('Could not read this backup file')}finally{e.target.value=''}});
if(!location.hash)location.hash='library';route();
</script>
</body>
